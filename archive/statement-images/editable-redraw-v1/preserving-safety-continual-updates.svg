<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title"><title id="title">II. Preserving Safety Through Continual Updates</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#203442"/></marker></defs><rect width="1448" height="1086" fill="white"/>
<text x="724" y="42" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#203442">II. Preserving Safety Through Continual Updates</text>
<text x="724" y="95" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">LLM or harness changes can invalidate existing guardrails</text>
<rect x="20" y="145" width="420" height="795" fill="#FFFFFF" stroke="#667985" stroke-width="1.6"/>
<text x="230" y="197" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1D6077">1  Propose Δ</text>
<rect x="514" y="145" width="420" height="795" fill="#FFFFFF" stroke="#667985" stroke-width="1.6"/>
<text x="724" y="197" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1D6077">2  Revalidate protection</text>
<rect x="1008" y="145" width="420" height="795" fill="#FFFFFF" stroke="#667985" stroke-width="1.6"/>
<text x="1218" y="197" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1D6077">3  Apply validated Δ</text>
<rect x="40" y="254" width="380" height="179" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="230" y="286" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">Current system</text>
<text x="230" y="335" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#203442">Sₜ = (Lₜ, Hₜ)</text>
<text x="230" y="365.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#203442">LLM + harness</text>
<text x="230" y="396" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#203442">including guardrails</text>
<rect x="40" y="464" width="380" height="131" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="230" y="496" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">LLM learning</text>
<text x="230" y="551.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">Paired authorized tasks</text>
<rect x="40" y="626" width="380" height="163" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="230" y="658" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">Harness upgrades</text>
<text x="230" y="713.64" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">Tools · monitors</text>
<text x="230" y="745.36" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">training feedback</text>
<text x="230" y="873.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#203442">Test a candidate before release.</text>
<text x="478" y="466.52000000000004" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203442">updated</text>
<text x="478" y="488.48" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203442">candidate</text>
<polyline points="448,530 508,530" fill="none" stroke="#203442" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="534" y="254" width="380" height="124" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="724" y="286" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">Protected requirements</text>
<text x="724" y="338" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#203442">Security · reliability · task completion</text>
<rect x="534" y="408" width="380" height="305" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="724" y="443" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#203442">Recheck existing guardrails</text>
<rect x="550" y="480" width="348" height="96" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="724" y="512" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">PolicyOK</text>
<text x="724" y="550" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#203442">Permissions · data boundaries</text>
<rect x="550" y="592" width="348" height="102" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="724" y="624" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">RetentionOK</text>
<text x="724" y="651.5799999999999" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#203442">Independent regression</text>
<text x="724" y="678.42" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#203442">and adversarial tests</text>
<polyline points="600,713 600,791" fill="none" stroke="#203442" stroke-width="2" marker-end="url(#arrow)"/>
<text x="705.5" y="755" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#203442">fail / unknown</text>
<rect x="534" y="791" width="380" height="131" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="724" y="823" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">Repair update or guardrails</text>
<text x="724" y="878.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#203442">Keep requirements unchanged</text>
<polyline points="850,791 850,713" fill="none" stroke="#203442" stroke-width="2" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="882" y="754" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203442">retest</text>
<text x="974" y="466.52000000000004" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203442">checked</text>
<text x="974" y="488.48" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203442">evidence</text>
<polyline points="944,530 1004,530" fill="none" stroke="#203442" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1028" y="254" width="380" height="280" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="1218" y="286" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">Update gate</text>
<text x="1218" y="352.56" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">Accept(Δ*) :=</text>
<text x="1218" y="384.28" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">PolicyOK ∧ RetentionOK</text>
<text x="1218" y="416" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442"></text>
<text x="1218" y="447.72" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">Release the checked</text>
<text x="1218" y="479.44" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">version only</text>
<polyline points="1218,534 1218,566" fill="none" stroke="#203442" stroke-width="2"/>
<polyline points="1218,566 1123,566 1123,630" fill="none" stroke="#203442" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1218,566 1313,566 1313,630" fill="none" stroke="#203442" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1123" y="549" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#203442">all pass</text>
<text x="1313" y="549" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#203442">fail / unknown</text>
<rect x="1028" y="630" width="181" height="65" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<rect x="1227" y="630" width="181" height="65" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="1118.5" y="662" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#203442">Apply Δ*</text>
<text x="1317.5" y="662" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#203442">Retain Sₜ</text>
<rect x="1028" y="747" width="380" height="175" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="1218" y="779" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">On acceptance</text>
<text x="1218" y="814.41" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#203442">Sₜ₊₁ = Update(Sₜ, Δ*)</text>
<text x="1218" y="842.4699999999999" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#203442"></text>
<text x="1218" y="870.53" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#203442">Δ*: checked change, including</text>
<text x="1218" y="898.5899999999999" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#203442">needed guardrail repairs</text>
<polyline points="1218,940 1218,965 15,965 15,343 40,343" fill="none" stroke="#203442" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="545" y="946" width="355" height="37" fill="#FFFFFF" stroke="#667985" stroke-width="1.6"/>
<text x="722.5" y="964.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#203442">Revalidate at every update</text>
<text x="724" y="1027.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#203442">Protection requirements stay fixed; guardrail implementations may evolve.</text>
</svg>
