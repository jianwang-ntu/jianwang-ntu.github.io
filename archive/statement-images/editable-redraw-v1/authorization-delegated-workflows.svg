<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1086" viewBox="0 0 1448 1086" role="img" aria-labelledby="title"><title id="title">III. Authorization Across Delegated Workflows</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#203442"/></marker></defs><rect width="1448" height="1086" fill="white"/>
<text x="724" y="42" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#203442">III. Authorization Across Delegated Workflows</text>
<text x="724" y="95" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">A private report can leak through a delegated email draft</text>
<rect x="20" y="145" width="420" height="795" fill="#FFFFFF" stroke="#667985" stroke-width="1.6"/>
<text x="230" y="197" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1D6077">1  A concrete handoff</text>
<rect x="514" y="145" width="420" height="795" fill="#FFFFFF" stroke="#667985" stroke-width="1.6"/>
<text x="724" y="197" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1D6077">2  Track workflow context</text>
<rect x="1008" y="145" width="420" height="795" fill="#FFFFFF" stroke="#667985" stroke-width="1.6"/>
<text x="1218" y="197" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1D6077">3  Enforce and recover</text>
<rect x="40" y="247" width="380" height="132" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="230" y="279" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">Approved task</text>
<text x="230" y="320.36" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#203442">Send a sanitized vendor update</text>
<text x="230" y="349.64" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#203442">Keep customer IDs internal</text>
<polyline points="230,379 230,421" fill="none" stroke="#203442" stroke-width="2" marker-end="url(#arrow)"/>
<text x="326" y="399.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#203442">delegated scope</text>
<rect x="40" y="421" width="380" height="132" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="230" y="453" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">Agent A: incident analyst</text>
<text x="230" y="494.36" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#203442">Reads private incident report</text>
<text x="230" y="523.64" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#203442">Drafts the vendor update</text>
<polyline points="230,553 230,591" fill="none" stroke="#203442" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="591" width="380" height="126" fill="#FFFFFF" stroke="#667985" stroke-width="1.6" stroke-dasharray="9 6"/>
<text x="230" y="617.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">Handoff package</text>
<text x="230" y="660.47" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#203442">Task: send the vendor update</text>
<text x="230" y="688.53" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#203442">Payload: draft with customer IDs</text>
<polyline points="230,717 230,756" fill="none" stroke="#203442" stroke-width="2" marker-end="url(#arrow)"/>
<text x="326.5" y="736" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#203442">task + data</text>
<rect x="40" y="756" width="380" height="120" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="230" y="788" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">Agent B: vendor liaison</text>
<text x="230" y="823.97" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#203442">Can email the external vendor</text>
<text x="230" y="852.03" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#203442">Uses A’s draft as message content</text>
<text x="230" y="895.1899999999999" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#203442">Read access + email access</text>
<text x="230" y="920.81" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#203442">do not authorize disclosure.</text>
<text x="478" y="466.52000000000004" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203442">authority +</text>
<text x="478" y="488.48" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203442">data lineage</text>
<polyline points="448,530 508,530" fill="none" stroke="#203442" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="534" y="254" width="380" height="174" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="724" y="286" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">ScopeOK</text>
<text x="724" y="363" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">Within delegated authority</text>
<rect x="534" y="457" width="380" height="174" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="724" y="489" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">FlowOK</text>
<text x="724" y="550.14" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">Preserves inherited</text>
<text x="724" y="581.86" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">data restrictions</text>
<rect x="534" y="660" width="380" height="174" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="724" y="692" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">FreshOK</text>
<text x="724" y="753.14" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">Approval dependencies</text>
<text x="724" y="784.86" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#203442">remain valid</text>
<text x="724" y="870.75" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#203442">Revocation or changed context</text>
<text x="724" y="901.25" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#203442">triggers revalidation.</text>
<text x="974" y="466.52000000000004" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203442">current</text>
<text x="974" y="488.48" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203442">context c</text>
<polyline points="944,530 1004,530" fill="none" stroke="#203442" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1028" y="254" width="380" height="321" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="1218" y="286" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#203442">Workflow authorization rule</text>
<text x="1218" y="377.94" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#203442">Allow(a, c) :=</text>
<text x="1218" y="407.22" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#203442">ScopeOK ∧ FlowOK ∧ FreshOK</text>
<text x="1218" y="436.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#203442"></text>
<text x="1218" y="465.78" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#203442">a: next delegated action</text>
<text x="1218" y="495.06" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#203442">c: current workflow context</text>
<polyline points="1218,575 1218,607" fill="none" stroke="#203442" stroke-width="2"/>
<polyline points="1218,607 1123,607 1123,671" fill="none" stroke="#203442" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1218,607 1313,607 1313,671" fill="none" stroke="#203442" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1123" y="590" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#203442">all pass</text>
<text x="1313" y="590" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#203442">fail / unknown</text>
<rect x="1028" y="671" width="181" height="65" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<rect x="1227" y="671" width="181" height="65" fill="#F1F6F8" stroke="#667985" stroke-width="1.6"/>
<text x="1118.5" y="703" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#203442">Execute</text>
<text x="1317.5" y="687.75" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#203442">Suspend /</text>
<text x="1317.5" y="718.25" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#203442">replan</text>
<text x="1218" y="807.75" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#203442">Revalidate affected work;</text>
<text x="1218" y="838.25" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#203442">preserve valid progress.</text>
<text x="724" y="1027.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#203442">Guarantees depend on captured effects and trusted enforcement. Recovery cannot undo completed disclosures.</text>
</svg>
