<text x="1755" y="458.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="26" font-weight="400" font-style="normal" fill="#08090B">fail / unknown</text>
<rect x="1335" y="501" width="241" height="64" fill="#F7F7F7" stroke="#08090B" stroke-width="2"/>
<rect x="1594" y="501" width="235" height="64" fill="#F7F7F7" stroke="#08090B" stroke-width="2"/>
<text x="1455.5" y="531.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="33" font-weight="700" font-style="normal" fill="#08090B">Apply Δ*</text>
<text x="1711.5" y="531.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="33" font-weight="700" font-style="normal" fill="#08090B">Retain Sₜ</text>
<rect x="1332" y="582" width="498" height="131" fill="#F7F7F7" stroke="#08090B" stroke-width="2"/>
<text x="1581" y="609" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#08090B">On acceptance:</text>
<text x="1581" y="652.5" dominant-baseline="central" text-anchor="middle" font-family="Times New Roman, serif" font-size="35" font-weight="400" font-style="italic" fill="#08090B">Sₜ₊₁ = Update(Sₜ, Δ*)</text>
<text x="1581" y="690.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="24" font-weight="400" font-style="normal" fill="#08090B">Δ*: checked change, including needed guardrail repairs</text>
<polyline points="1581,726 1581,769 43,769 43,302 66,302" fill="none" stroke="#08090B" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="776" y="731" width="338" height="35" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="945" y="748.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="29" font-weight="400" font-style="normal" fill="#08090B">Revalidate at every update</text>
<text x="935" y="810.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="28" font-weight="400" font-style="normal" fill="#08090B">Protection requirements stay fixed; guardrail implementations may evolve.</text>
