<text x="936.5" y="406" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="29" font-weight="700" font-style="normal" fill="#08090B">PolicyOK</text>
<text x="936.5" y="438.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="25" font-weight="400" font-style="normal" fill="#08090B">Permissions · data boundaries</text>
<rect x="726" y="470" width="421" height="73" fill="#FAFAFA" stroke="#9DA6AF" stroke-width="1.1"/>
<text x="936.5" y="492" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="29" font-weight="700" font-style="normal" fill="#08090B">RetentionOK</text>
<text x="936.5" y="524" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="25" font-weight="400" font-style="normal" fill="#08090B">Independent regression and adversarial tests</text>
<polyline points="814,555 814,616" fill="none" stroke="#08090B" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="909" y="584.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="26" font-weight="400" font-style="normal" fill="#08090B">fail / unknown</text>
<polyline points="1044,616 1044,555" fill="none" stroke="#08090B" stroke-width="2.4" stroke-dasharray="10 6" marker-end="url(#arrow)"/>
<text x="1104.5" y="584.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="26" font-weight="400" font-style="normal" fill="#08090B">retest</text>
<rect x="700" y="616" width="472" height="87" fill="#F7F7F7" stroke="#08090B" stroke-width="2"/>
<text x="936" y="643.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="33" font-weight="700" font-style="normal" fill="#08090B">Repair update or guardrails</text>
<text x="936" y="681" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="27" font-weight="400" font-style="normal" fill="#08090B">Keep requirements unchanged</text>
<text x="1254.5" y="372.68" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="26" font-weight="400" font-style="normal" fill="#08090B">checked</text>
<text x="1254.5" y="402.32" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="26" font-weight="400" font-style="normal" fill="#08090B">evidence</text>
<polyline points="1195,425 1316,425" fill="none" stroke="#08090B" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1343" y="219" width="475" height="206" fill="#F7F7F7" stroke="#08090B" stroke-width="2"/>
<text x="1580.5" y="250.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#08090B">Update gate</text>
<text x="1580" y="299.5" dominant-baseline="central" text-anchor="middle" font-family="Times New Roman, serif" font-size="36" font-weight="400" font-style="italic" fill="#08090B">Accept(Δ*) :=</text>
<text x="1580" y="346" dominant-baseline="central" text-anchor="middle" font-family="Times New Roman, serif" font-size="36" font-weight="400" font-style="italic" fill="#08090B">PolicyOK ∧ RetentionOK</text>
<text x="1580" y="395" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="29" font-weight="400" font-style="normal" fill="#08090B">Release the checked version only</text>
