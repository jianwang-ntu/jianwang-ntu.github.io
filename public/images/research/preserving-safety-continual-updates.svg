<svg xmlns="http://www.w3.org/2000/svg" width="1870" height="841" viewBox="0 0 1870 841" role="img" aria-labelledby="title"><title id="title">Preserving Safety Through Continual Updates</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#08090B"/></marker></defs><rect width="1870" height="841" fill="white"/>
<text x="935" y="31.5" dominant-baseline="central" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" font-style="normal" fill="#08090B">Preserving Safety Through Continual Updates</text>
<text x="935" y="86.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="40" font-weight="400" font-style="normal" fill="#08090B">LLM or harness changes can invalidate existing guardrails</text>
<rect x="26" y="138" width="531" height="588" fill="#FFFFFF" stroke="#08090B" stroke-width="2"/>
<rect x="676" y="138" width="519" height="588" fill="#FFFFFF" stroke="#08090B" stroke-width="2"/>
<rect x="1316" y="138" width="529" height="588" fill="#FFFFFF" stroke="#08090B" stroke-width="2"/>
<ellipse cx="80.5" cy="177.5" rx="31.5" ry="30.5" fill="#FFFFFF" stroke="#08090B" stroke-width="2.4"/>
<text x="80.5" y="177.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="40" font-weight="700" font-style="normal" fill="#08090B">1</text>
<text x="143" y="177.5" dominant-baseline="central" text-anchor="start" font-family="Arial Narrow, sans-serif" font-size="42" font-weight="700" font-style="normal" fill="#08090B">Propose Δ</text>
<ellipse cx="730.5" cy="177.5" rx="31.5" ry="30.5" fill="#FFFFFF" stroke="#08090B" stroke-width="2.4"/>
<text x="730.5" y="177.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="40" font-weight="700" font-style="normal" fill="#08090B">2</text>
<text x="793" y="177.5" dominant-baseline="central" text-anchor="start" font-family="Arial Narrow, sans-serif" font-size="42" font-weight="700" font-style="normal" fill="#08090B">Revalidate protection</text>
<ellipse cx="1369.5" cy="177.5" rx="31.5" ry="30.5" fill="#FFFFFF" stroke="#08090B" stroke-width="2.4"/>
<text x="1369.5" y="177.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="40" font-weight="700" font-style="normal" fill="#08090B">3</text>
<text x="1432" y="177.5" dominant-baseline="central" text-anchor="start" font-family="Arial Narrow, sans-serif" font-size="42" font-weight="700" font-style="normal" fill="#08090B">Apply validated Δ</text>
<rect x="66" y="220" width="464" height="173" fill="#F7F7F7" stroke="#08090B" stroke-width="2"/>
<text x="298" y="257" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="34" font-weight="700" font-style="normal" fill="#08090B">Current system</text>
<text x="298" y="307.5" dominant-baseline="central" text-anchor="middle" font-family="Times New Roman, serif" font-size="42" font-weight="400" font-style="italic" fill="#08090B">Sₜ = (Lₜ, Hₜ)</text>
<text x="298" y="356.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="28" font-weight="400" font-style="normal" fill="#08090B">LLM + harness, including guardrails</text>
<rect x="76" y="408" width="447" height="100" fill="#F7F7F7" stroke="#08090B" stroke-width="2"/>
<text x="299.5" y="438" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#08090B">LLM learning</text>
<text x="299.5" y="479.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="28" font-weight="400" font-style="normal" fill="#08090B">Paired authorized tasks</text>
<rect x="76" y="524" width="447" height="101" fill="#F7F7F7" stroke="#08090B" stroke-width="2"/>
<text x="299.5" y="554" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="32" font-weight="700" font-style="normal" fill="#08090B">Harness upgrades</text>
<text x="299.5" y="595.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="28" font-weight="400" font-style="normal" fill="#08090B">Tools · monitors · training feedback</text>
<text x="297" y="684" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="29" font-weight="400" font-style="normal" fill="#08090B">Test a candidate before release.</text>
<text x="615.5" y="372.68" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="26" font-weight="400" font-style="normal" fill="#08090B">updated</text>
<text x="615.5" y="402.32" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="26" font-weight="400" font-style="normal" fill="#08090B">candidate</text>
<polyline points="557,425 676,425" fill="none" stroke="#08090B" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="701" y="219" width="471" height="96" fill="#F7F7F7" stroke="#08090B" stroke-width="2"/>
<text x="936.5" y="249.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="33" font-weight="700" font-style="normal" fill="#08090B">Protected requirements</text>
<text x="937" y="287.5" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="27" font-weight="400" font-style="normal" fill="#08090B">Security · reliability · task completion</text>
<rect x="701" y="331" width="471" height="224" fill="#F7F7F7" stroke="#08090B" stroke-width="2"/>
<text x="936.5" y="357" dominant-baseline="central" text-anchor="middle" font-family="Arial Narrow, sans-serif" font-size="33" font-weight="700" font-style="normal" fill="#08090B">Recheck existing guardrails</text>
