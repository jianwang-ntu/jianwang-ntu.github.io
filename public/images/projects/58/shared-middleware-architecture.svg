<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Shared asynchronous web framework architecture</title>
  <desc id="desc">App-facing services, Mobile WAP, and multiple business lines connect through a shared asynchronous web framework containing a request lifecycle, middleware chain, and common components before reaching business and platform services.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9f4"/>
      <stop offset="1" stop-color="#f3f6f8"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2940"/>
      <stop offset="1" stop-color="#111d31"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#b6532d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#16233a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#ground)"/>
  <circle cx="1325" cy="95" r="180" fill="#ec8a57" opacity=".08"/>
  <circle cx="84" cy="824" r="170" fill="#2d6f83" opacity=".06"/>

  <text x="76" y="86" fill="#a7461f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700" letter-spacing="4">SHARED WEB FRAMEWORK</text>
  <text x="76" y="143" fill="#17233b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="43" font-weight="750">Shared request handling for several products</text>
  <text x="76" y="183" fill="#59636d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22">App, Mobile WAP, and business sites use the same infrastructure layer.</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="74" y="285" fill="#69727b" font-size="18" font-weight="700" letter-spacing="2">BUSINESS SURFACES</text>
    <g filter="url(#shadow)">
      <rect x="74" y="316" width="282" height="104" rx="18" fill="#ffffff" stroke="#e5d7cd" stroke-width="2"/>
      <circle cx="112" cy="350" r="12" fill="#dc733f"/>
      <text x="140" y="359" fill="#17233b" font-size="25" font-weight="700">App-facing services</text>
      <text x="112" y="392" fill="#68717a" font-size="18">mobile product endpoints</text>

      <rect x="74" y="444" width="282" height="104" rx="18" fill="#ffffff" stroke="#e5d7cd" stroke-width="2"/>
      <circle cx="112" cy="478" r="12" fill="#dc733f"/>
      <text x="140" y="487" fill="#17233b" font-size="25" font-weight="700">Mobile WAP</text>
      <text x="112" y="520" fill="#68717a" font-size="18">browser-facing experience</text>

      <rect x="74" y="572" width="282" height="104" rx="18" fill="#ffffff" stroke="#e5d7cd" stroke-width="2"/>
      <circle cx="112" cy="606" r="12" fill="#dc733f"/>
      <text x="140" y="615" fill="#17233b" font-size="25" font-weight="700">Business lines</text>
      <text x="112" y="648" fill="#68717a" font-size="18">independent product logic</text>
    </g>

    <path d="M356 368H440" fill="none" stroke="#b6532d" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M356 496H440" fill="none" stroke="#b6532d" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M356 624H440" fill="none" stroke="#b6532d" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="452" y="272" width="538" height="474" rx="30" fill="url(#core)"/>
    </g>
    <text x="500" y="328" fill="#f0a278" font-size="18" font-weight="700" letter-spacing="2">SHARED ASYNCHRONOUS WEB FRAMEWORK</text>
    <text x="500" y="375" fill="#ffffff" font-size="32" font-weight="750">Asynchronous web framework</text>
    <text x="500" y="410" fill="#bdc8d3" font-size="18">shared request lifecycle and middleware</text>

    <rect x="500" y="452" width="442" height="66" rx="13" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".19"/>
    <text x="530" y="493" fill="#ffffff" font-size="23" font-weight="700">Request lifecycle</text>
    <text x="922" y="492" fill="#8fd3df" font-size="15" text-anchor="end">accept → schedule → return</text>

    <rect x="500" y="536" width="442" height="66" rx="13" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".19"/>
    <text x="530" y="577" fill="#ffffff" font-size="23" font-weight="700">Middleware chain</text>
    <text x="922" y="576" fill="#8fd3df" font-size="15" text-anchor="end">compose per business</text>

    <rect x="500" y="620" width="442" height="78" rx="13" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".19"/>
    <text x="530" y="656" fill="#ffffff" font-size="23" font-weight="700">Common components</text>
    <text x="530" y="682" fill="#bdc8d3" font-size="17">shared capabilities behind stable interfaces</text>

    <path d="M990 432H1068" fill="none" stroke="#b6532d" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M990 580H1068" fill="none" stroke="#b6532d" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="1072" y="285" fill="#69727b" font-size="18" font-weight="700" letter-spacing="2">DESTINATIONS</text>
    <g filter="url(#shadow)">
      <rect x="1072" y="316" width="292" height="136" rx="18" fill="#ffffff" stroke="#d7dfe4" stroke-width="2"/>
      <text x="1110" y="361" fill="#17233b" font-size="24" font-weight="700">Business services</text>
      <text x="1110" y="397" fill="#68717a" font-size="18">domain-specific handlers</text>
      <text x="1110" y="424" fill="#68717a" font-size="18">owned by product teams</text>

      <rect x="1072" y="482" width="292" height="136" rx="18" fill="#ffffff" stroke="#d7dfe4" stroke-width="2"/>
      <text x="1110" y="527" fill="#17233b" font-size="24" font-weight="700">Platform services</text>
      <text x="1110" y="563" fill="#68717a" font-size="18">shared data and systems</text>
      <text x="1110" y="590" fill="#68717a" font-size="18">behind common contracts</text>
    </g>

    <rect x="452" y="786" width="912" height="58" rx="16" fill="#ffffff" stroke="#e1d8d1"/>
    <text x="908" y="823" text-anchor="middle" fill="#4d5963" font-size="20">Business-specific handlers remain outside the shared framework.</text>
  </g>
</svg>
