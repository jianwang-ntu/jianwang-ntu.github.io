<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">共享异步 Web 框架架构</title>
  <desc id="desc">App、Mobile WAP 和多个业务站点通过共享异步 Web 框架访问业务服务与平台服务。框架统一处理请求生命周期、中间件和公共组件。</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9f4"/>
      <stop offset="1" stop-color="#f3f6f8"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2940"/>
      <stop offset="1" stop-color="#111d31"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#b6532d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#16233a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#ground)"/>
  <circle cx="1325" cy="95" r="180" fill="#ec8a57" opacity=".08"/>
  <circle cx="84" cy="824" r="170" fill="#2d6f83" opacity=".06"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
    <text x="76" y="86" fill="#a7461f" font-size="22" font-weight="700" letter-spacing="4">共享 WEB 框架</text>
    <text x="76" y="143" fill="#17233b" font-size="43" font-weight="750">多个产品共用一套请求处理基础设施</text>
    <text x="76" y="183" fill="#59636d" font-size="22">App、Mobile WAP 与业务站点通过统一框架访问后端服务。</text>

    <text x="74" y="285" fill="#69727b" font-size="18" font-weight="700" letter-spacing="2">业务入口</text>
    <g filter="url(#shadow)">
      <rect x="74" y="316" width="282" height="104" rx="18" fill="#ffffff" stroke="#e5d7cd" stroke-width="2"/>
      <circle cx="112" cy="350" r="12" fill="#dc733f"/>
      <text x="140" y="359" fill="#17233b" font-size="25" font-weight="700">App 接入服务</text>
      <text x="112" y="392" fill="#68717a" font-size="18">移动产品接口</text>

      <rect x="74" y="444" width="282" height="104" rx="18" fill="#ffffff" stroke="#e5d7cd" stroke-width="2"/>
      <circle cx="112" cy="478" r="12" fill="#dc733f"/>
      <text x="140" y="487" fill="#17233b" font-size="25" font-weight="700">Mobile WAP</text>
      <text x="112" y="520" fill="#68717a" font-size="18">浏览器端页面</text>

      <rect x="74" y="572" width="282" height="104" rx="18" fill="#ffffff" stroke="#e5d7cd" stroke-width="2"/>
      <circle cx="112" cy="606" r="12" fill="#dc733f"/>
      <text x="140" y="615" fill="#17233b" font-size="25" font-weight="700">业务站点</text>
      <text x="112" y="648" fill="#68717a" font-size="18">独立业务逻辑</text>
    </g>

    <path d="M356 368H440" fill="none" stroke="#b6532d" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M356 496H440" fill="none" stroke="#b6532d" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M356 624H440" fill="none" stroke="#b6532d" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="452" y="272" width="538" height="474" rx="30" fill="url(#core)"/>
    </g>
    <text x="500" y="328" fill="#f0a278" font-size="18" font-weight="700" letter-spacing="2">共享异步 WEB 框架</text>
    <text x="500" y="375" fill="#ffffff" font-size="32" font-weight="750">统一执行层</text>
    <text x="500" y="410" fill="#bdc8d3" font-size="18">统一请求生命周期 · 可组合中间件 · 异步 I/O</text>

    <rect x="500" y="452" width="442" height="66" rx="13" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".19"/>
    <text x="530" y="493" fill="#ffffff" font-size="23" font-weight="700">请求生命周期</text>
    <text x="922" y="492" fill="#8fd3df" font-size="15" text-anchor="end">接入 → 调度 → 返回</text>

    <rect x="500" y="536" width="442" height="66" rx="13" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".19"/>
    <text x="530" y="577" fill="#ffffff" font-size="23" font-weight="700">中间件链</text>
    <text x="922" y="576" fill="#8fd3df" font-size="15" text-anchor="end">按业务组合</text>

    <rect x="500" y="620" width="442" height="78" rx="13" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".19"/>
    <text x="530" y="656" fill="#ffffff" font-size="23" font-weight="700">公共组件</text>
    <text x="530" y="682" fill="#bdc8d3" font-size="17">通过稳定接口提供共享能力</text>

    <path d="M990 432H1068" fill="none" stroke="#b6532d" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M990 580H1068" fill="none" stroke="#b6532d" stroke-width="4" marker-end="url(#arrow)"/>

    <text x="1072" y="285" fill="#69727b" font-size="18" font-weight="700" letter-spacing="2">后端服务</text>
    <g filter="url(#shadow)">
      <rect x="1072" y="316" width="292" height="136" rx="18" fill="#ffffff" stroke="#d7dfe4" stroke-width="2"/>
      <text x="1110" y="361" fill="#17233b" font-size="24" font-weight="700">业务服务</text>
      <text x="1110" y="397" fill="#68717a" font-size="18">各业务线维护</text>
      <text x="1110" y="424" fill="#68717a" font-size="18">承载具体业务逻辑</text>

      <rect x="1072" y="482" width="292" height="136" rx="18" fill="#ffffff" stroke="#d7dfe4" stroke-width="2"/>
      <text x="1110" y="527" fill="#17233b" font-size="24" font-weight="700">平台服务</text>
      <text x="1110" y="563" fill="#68717a" font-size="18">共享数据与系统</text>
      <text x="1110" y="590" fill="#68717a" font-size="18">通过统一接口调用</text>
    </g>

    <rect x="452" y="786" width="912" height="58" rx="16" fill="#ffffff" stroke="#e1d8d1"/>
    <text x="908" y="823" text-anchor="middle" fill="#4d5963" font-size="20">业务处理器位于框架之外；公共请求处理集中在共享层。</text>
  </g>
</svg>
