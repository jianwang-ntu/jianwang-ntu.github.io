<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Nginx 流量路由模块架构</title>
  <desc id="desc">入口流量经过 Nginx 内的自定义路由模块。模块读取请求字段、匹配集中规则并选择上游业务服务池。</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8fa"/>
      <stop offset="1" stop-color="#fff7f0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182740"/>
      <stop offset="1" stop-color="#101c2e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#b6532d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#16233a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#ground)"/>
  <path d="M0 778C220 712 360 848 572 796s378-88 578-16 290 28 290 28v92H0Z" fill="#d76b38" opacity=".06"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">
    <text x="76" y="86" fill="#a7461f" font-size="22" font-weight="700" letter-spacing="4">NGINX 流量路由</text>
    <text x="76" y="143" fill="#17233b" font-size="43" font-weight="750">在 Nginx 内完成流量路由</text>
    <text x="76" y="183" fill="#59636d" font-size="22">自定义模块在请求进入应用服务前执行统一路由策略。</text>

    <g filter="url(#shadow)">
      <rect x="74" y="348" width="246" height="218" rx="26" fill="#ffffff" stroke="#d9e2e7" stroke-width="2"/>
    </g>
    <circle cx="197" cy="411" r="34" fill="#f5d7c8"/>
    <path d="M178 411h38M185 398l-13 13 13 13M209 398l13 13-13 13" fill="none" stroke="#a7461f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="197" y="479" text-anchor="middle" fill="#17233b" font-size="27" font-weight="750">入口流量</text>
    <text x="197" y="515" text-anchor="middle" fill="#68717a" font-size="18">App · WAP · Web</text>

    <path d="M320 457H410" fill="none" stroke="#b6532d" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="365" y="434" text-anchor="middle" fill="#7a6155" font-size="16" font-weight="700">请求</text>

    <g filter="url(#shadow)">
      <rect x="424" y="254" width="592" height="472" rx="32" fill="url(#edge)"/>
    </g>
    <text x="474" y="314" fill="#f0a278" font-size="18" font-weight="700" letter-spacing="2">NGINX 工作进程</text>
    <text x="474" y="359" fill="#ffffff" font-size="31" font-weight="750">自定义流量路由模块</text>
    <text x="474" y="394" fill="#bdc8d3" font-size="18">运行在请求处理链路中</text>

    <rect x="474" y="442" width="492" height="76" rx="14" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".2"/>
    <circle cx="508" cy="480" r="14" fill="#dc733f"/>
    <text x="540" y="488" fill="#ffffff" font-size="23" font-weight="700">读取路由字段</text>

    <path d="M720 518V548" stroke="#f0a278" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="474" y="558" width="492" height="76" rx="14" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".2"/>
    <circle cx="508" cy="596" r="14" fill="#dc733f"/>
    <text x="540" y="604" fill="#ffffff" font-size="23" font-weight="700">匹配规则 · 选择上游</text>

    <text x="474" y="683" fill="#8fd3df" font-size="17">路由规则在热路径之外管理</text>
    <path d="M1016 457H1106" fill="none" stroke="#b6532d" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="1061" y="434" text-anchor="middle" fill="#7a6155" font-size="16" font-weight="700">转发</text>

    <text x="1118" y="280" fill="#69727b" font-size="18" font-weight="700" letter-spacing="2">上游服务池</text>
    <g filter="url(#shadow)">
      <rect x="1118" y="316" width="246" height="106" rx="18" fill="#ffffff" stroke="#e3d8d0" stroke-width="2"/>
      <rect x="1118" y="444" width="246" height="106" rx="18" fill="#ffffff" stroke="#e3d8d0" stroke-width="2"/>
      <rect x="1118" y="572" width="246" height="106" rx="18" fill="#ffffff" stroke="#e3d8d0" stroke-width="2"/>
    </g>
    <rect x="1152" y="348" width="18" height="42" rx="4" fill="#dc733f"/>
    <rect x="1178" y="348" width="18" height="42" rx="4" fill="#e8a17d"/>
    <text x="1222" y="378" fill="#17233b" font-size="23" font-weight="700">业务 A</text>
    <rect x="1152" y="476" width="18" height="42" rx="4" fill="#dc733f"/>
    <rect x="1178" y="476" width="18" height="42" rx="4" fill="#e8a17d"/>
    <text x="1222" y="506" fill="#17233b" font-size="23" font-weight="700">业务 B</text>
    <rect x="1152" y="604" width="18" height="42" rx="4" fill="#dc733f"/>
    <rect x="1178" y="604" width="18" height="42" rx="4" fill="#e8a17d"/>
    <text x="1222" y="634" fill="#17233b" font-size="23" font-weight="700">业务 C</text>

    <rect x="74" y="780" width="1290" height="64" rx="16" fill="#ffffff" stroke="#e1d8d1"/>
    <text x="719" y="820" text-anchor="middle" fill="#4d5963" font-size="20">路由配置集中管理；应用服务仍作为普通上游节点运行。</text>
  </g>
</svg>
