<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Nginx 自定义流量路由器架构</title>
  <desc id="desc">请求数据面读取路由字段，匹配 worker 本地规则快照，选择上游服务池，并在需要时进入回退路径。独立的控制面负责校验、版本化和原子发布集中管理的规则。</desc>
  <defs><marker id="hotArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c2673f"/></marker><marker id="controlArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#4f748a"/></marker><pattern id="placeholder" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f5f0fb"/><line y2="10" stroke="#ded1ee" stroke-width="3"/></pattern><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2a3d4d" flood-opacity=".1"/></filter><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}.kicker{font-size:18px;font-weight:750;letter-spacing:3px;fill:#a95837}.title{font-size:40px;font-weight:760;fill:#223744}.sub{font-size:20px;fill:#60717c}.stage{font-size:16px;font-weight:760;letter-spacing:1.8px;fill:#60717c}.box-title{font-size:20px;font-weight:720;fill:#263c48}.box-sub{font-size:14px;fill:#65747d}.small{font-size:13px;fill:#6f7b82}.white-title{font-size:20px;font-weight:720;fill:#fff}.white-sub{font-size:14px;fill:#cbd8df}.tag{font-size:11px;font-weight:780;letter-spacing:1.1px;fill:#6f4c88}.legend{font-size:14px;fill:#596871}.hot{fill:none;stroke:#c2673f;stroke-width:4;marker-end:url(#hotArrow)}.control{fill:none;stroke:#4f748a;stroke-width:3;marker-end:url(#controlArrow)}.fallback{fill:none;stroke:#c2673f;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#hotArrow)}</style></defs>
  <rect width="1440" height="900" fill="#fbfaf8"/><text x="64" y="67" class="kicker">58同城 · NGINX 流量路由器</text><text x="64" y="120" class="title">在请求进入应用服务之前完成路由</text><text x="64" y="158" class="sub">请求热路径读取 worker 本地规则快照；规则更新走独立链路</text>
  <rect x="64" y="202" width="1312" height="406" rx="28" fill="#fff3ec" stroke="#e4b49e" stroke-width="2"/><text x="92" y="240" class="stage">数据面 · 每个请求都会经过</text>
  <g filter="url(#shadow)"><rect x="92" y="274" width="190" height="286" rx="22" fill="#fff" stroke="#e3d8d1" stroke-width="2"/></g><circle cx="187" cy="354" r="40" fill="#f3d3c4"/><path d="M164 354h46M173 339l-15 15 15 15M201 339l15 15-15 15" fill="none" stroke="#a95837" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="187" y="432" text-anchor="middle" class="box-title">进入的请求</text><text x="187" y="462" text-anchor="middle" class="box-sub">App · WAP · Web</text><text x="187" y="488" text-anchor="middle" class="box-sub">Host · 路径 · Header</text><path d="M282 417H330" class="hot"/>
  <rect x="330" y="274" width="704" height="286" rx="24" fill="#263d4a"/><text x="358" y="310" class="stage" fill="#f3b392">NGINX WORKER · 自定义模块</text><rect x="358" y="340" width="146" height="120" rx="16" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".25"/><text x="431" y="385" text-anchor="middle" class="white-title">读取</text><text x="431" y="414" text-anchor="middle" class="white-sub">策略所需字段</text><text x="431" y="438" text-anchor="middle" class="white-sub">不读取无关内容</text><path d="M504 400H536" class="hot"/><rect x="536" y="330" width="196" height="140" rx="18" fill="url(#placeholder)" stroke="#c6aad8" stroke-width="2" stroke-dasharray="8 6"/><text x="634" y="360" text-anchor="middle" class="tag">功能占位块</text><text x="634" y="397" text-anchor="middle" class="box-title">策略匹配器</text><text x="634" y="425" text-anchor="middle" class="box-sub">内部索引结构未保留</text><text x="634" y="449" text-anchor="middle" class="box-sub">匹配开销保持有界</text><path d="M732 400H764" class="hot"/><rect x="764" y="340" width="146" height="120" rx="16" fill="#fff" opacity=".1" stroke="#fff" stroke-opacity=".25"/><text x="837" y="385" text-anchor="middle" class="white-title">选择</text><text x="837" y="414" text-anchor="middle" class="white-sub">上游服务池</text><text x="837" y="438" text-anchor="middle" class="white-sub">或回退路径</text><path d="M910 400H942" class="hot"/><rect x="942" y="340" width="66" height="120" rx="16" fill="#4f6876"/><text x="975" y="389" text-anchor="middle" class="white-title">转发</text><text x="975" y="418" text-anchor="middle" class="white-sub">请求</text><rect x="358" y="492" width="650" height="42" rx="13" fill="#405965"/><text x="683" y="519" text-anchor="middle" class="white-sub">热路径计算保持在 worker 本地</text><path d="M1034 417H1082" class="hot"/>
  <g filter="url(#shadow)"><rect x="1082" y="274" width="266" height="286" rx="22" fill="#fff" stroke="#e3d8d1" stroke-width="2"/></g><text x="1108" y="312" class="stage">上游服务池</text><rect x="1108" y="338" width="100" height="72" rx="14" fill="#eaf2f5" stroke="#c6d9e1"/><text x="1158" y="381" text-anchor="middle" class="box-title">业务 A</text><rect x="1222" y="338" width="100" height="72" rx="14" fill="#edf4e8" stroke="#bfd3b4"/><text x="1272" y="381" text-anchor="middle" class="box-title">业务 B</text><rect x="1108" y="430" width="100" height="72" rx="14" fill="#f1ecf5" stroke="#d4c6df"/><text x="1158" y="473" text-anchor="middle" class="box-title">业务 C</text><rect x="1222" y="430" width="100" height="72" rx="14" fill="#fff3ec" stroke="#e3b49e"/><text x="1272" y="462" text-anchor="middle" class="box-title">回退</text><text x="1272" y="484" text-anchor="middle" class="small">明确目标</text><path d="M1215 560V532H1272V510" class="fallback"/><text x="1130" y="542" class="small">不可用 / 未匹配</text>
  <rect x="64" y="642" width="1312" height="148" rx="24" fill="#edf3f6" stroke="#c9d9e1" stroke-width="2"/><text x="92" y="678" class="stage">控制面 · 规则更新链路</text><rect x="92" y="700" width="220" height="62" rx="14" fill="#fff" stroke="#c7d8e0"/><text x="202" y="739" text-anchor="middle" class="box-title">集中管理的路由规则</text><path d="M312 731H354" class="control"/><rect x="354" y="700" width="206" height="62" rx="14" fill="#fff" stroke="#c7d8e0"/><text x="457" y="727" text-anchor="middle" class="box-title">校验 + 版本化</text><text x="457" y="749" text-anchor="middle" class="small">拒绝无效更新</text><path d="M560 731H602" class="control"/><rect x="602" y="700" width="206" height="62" rx="14" fill="#fff" stroke="#c7d8e0"/><text x="705" y="727" text-anchor="middle" class="box-title">原子发布</text><text x="705" y="749" text-anchor="middle" class="small">不暴露半套规则</text><path d="M808 731H850" class="control"/><rect x="850" y="700" width="240" height="62" rx="14" fill="#fff" stroke="#c7d8e0"/><text x="970" y="727" text-anchor="middle" class="box-title">Worker 本地快照</text><text x="970" y="749" text-anchor="middle" class="small">活动请求继续运行</text><path d="M970 700V620H634V478" class="control"/><rect x="1120" y="700" width="228" height="62" rx="14" fill="#fff3ec" stroke="#e3b49e"/><text x="1234" y="727" text-anchor="middle" class="box-title">隔离边界</text><text x="1234" y="749" text-anchor="middle" class="small">目标故障限制在本路由</text>
  <rect x="64" y="820" width="1312" height="50" rx="14" fill="#fff" stroke="#dfe6e9"/><line x1="92" y1="845" x2="136" y2="845" class="hot"/><text x="150" y="850" class="legend">请求热路径</text><line x1="320" y1="845" x2="364" y2="845" class="control"/><text x="378" y="850" class="legend">规则更新链路</text><line x1="554" y1="845" x2="598" y2="845" class="fallback"/><text x="612" y="850" class="legend">回退路径</text><rect x="748" y="836" width="28" height="18" rx="4" fill="url(#placeholder)" stroke="#9372ac" stroke-dasharray="5 4"/><text x="788" y="850" class="legend">功能角色；内部数据结构未保留</text>
</svg>
