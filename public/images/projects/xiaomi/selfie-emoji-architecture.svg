<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Selfie-to-emoji generation system architecture</title>
  <desc id="desc">A conceptual inference path from an aligned selfie through placeholder identity encoding and GAN-class generation to consistent expression variants, plus a separate training-only path for identity, style, and consistency checks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#526d82"/></marker>
    <marker id="trainArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c5683f"/></marker>
    <pattern id="placeholder" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f5f0fb"/><line y2="10" stroke="#ded1ee" stroke-width="3"/></pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2a3d4d" flood-opacity=".1"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.kicker{font-size:18px;font-weight:750;letter-spacing:3px;fill:#a95837}.title{font-size:40px;font-weight:760;fill:#223744}.sub{font-size:20px;fill:#60717c}.stage{font-size:17px;font-weight:760;letter-spacing:2px;fill:#60717c}.box-title{font-size:22px;font-weight:720;fill:#263c48}.box-sub{font-size:16px;fill:#65747d}.small{font-size:14px;fill:#6f7b82}.white-title{font-size:22px;font-weight:720;fill:#fff}.white-sub{font-size:15px;fill:#cbd8df}.tag{font-size:12px;font-weight:780;letter-spacing:1.4px;fill:#6f4c88}.legend{font-size:14px;fill:#596871}.arrow{fill:none;stroke:#526d82;stroke-width:4;marker-end:url(#arrow)}.train{fill:none;stroke:#c5683f;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#trainArrow)}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#fbfaf8"/>
  <text x="64" y="67" class="kicker">SELFIE → EMOJI</text>
  <text x="64" y="120" class="title">Identity-preserving character generation</text>
  <text x="64" y="158" class="sub">System-level reconstruction · inference and training-only checks are separated</text>

  <rect x="64" y="206" width="1312" height="420" rx="28" fill="#eef4f7" stroke="#ccdae1" stroke-width="2"/>
  <text x="92" y="244" class="stage">HANDSET INFERENCE PATH</text>
  <g filter="url(#shadow)"><rect x="92" y="278" width="196" height="306" rx="22" fill="#fff" stroke="#d9e3e8" stroke-width="2"/></g>
  <rect x="119" y="306" width="142" height="164" rx="18" fill="#d9e6ee"/>
  <circle cx="190" cy="359" r="36" fill="#efc4ad"/><path d="M143 452c6-51 26-76 47-76s42 25 48 76" fill="#405f72"/>
  <text x="190" y="516" text-anchor="middle" class="box-title">Selfie input</text>
  <text x="190" y="546" text-anchor="middle" class="box-sub">detect · align · crop</text>

  <path d="M288 431H342" class="arrow"/>
  <rect x="342" y="278" width="260" height="306" rx="22" fill="url(#placeholder)" stroke="#9372ac" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="366" y="302" width="132" height="26" rx="13" fill="#e3d6ef"/>
  <text x="432" y="320" text-anchor="middle" class="tag">ROLE PLACEHOLDER</text>
  <text x="472" y="381" text-anchor="middle" class="box-title">Identity + structure</text>
  <text x="472" y="413" text-anchor="middle" class="box-sub">encoder / face representation</text>
  <g fill="#bca7cf"><rect x="385" y="457" width="174" height="20" rx="6"/><rect x="407" y="491" width="130" height="20" rx="6"/><rect x="432" y="525" width="80" height="20" rx="6"/></g>

  <path d="M602 431H656" class="arrow"/>
  <rect x="656" y="278" width="264" height="306" rx="22" fill="#263d4a" stroke="#263d4a" stroke-width="2"/>
  <rect x="680" y="302" width="132" height="26" rx="13" fill="#e3d6ef"/>
  <text x="746" y="320" text-anchor="middle" class="tag">ROLE PLACEHOLDER</text>
  <text x="788" y="382" text-anchor="middle" class="white-title">Generator</text>
  <text x="788" y="415" text-anchor="middle" class="white-sub">GAN class</text>
  <text x="788" y="456" text-anchor="middle" class="white-sub">identity-conditioned style</text>
  <text x="788" y="482" text-anchor="middle" class="white-sub">+ expression control</text>
  <rect x="698" y="518" width="180" height="36" rx="18" fill="#4d6876"/>
  <text x="788" y="542" text-anchor="middle" class="white-sub">converted handset graph</text>

  <path d="M920 431H974" class="arrow"/>
  <g filter="url(#shadow)"><rect x="974" y="278" width="374" height="306" rx="22" fill="#fff" stroke="#d9e3e8" stroke-width="2"/></g>
  <text x="1002" y="320" class="box-title">Consistent character set</text>
  <text x="1002" y="349" class="box-sub">same identity · shared visual language</text>
  <g>
    <rect x="1002" y="385" width="72" height="118" rx="18" fill="#e8f0dd"/><rect x="1084" y="385" width="72" height="118" rx="18" fill="#f6e2d4"/><rect x="1166" y="385" width="72" height="118" rx="18" fill="#dcebf1"/><rect x="1248" y="385" width="72" height="118" rx="18" fill="#eee4f5"/>
    <g fill="#efc4ad"><circle cx="1038" cy="428" r="22"/><circle cx="1120" cy="428" r="22"/><circle cx="1202" cy="428" r="22"/><circle cx="1284" cy="428" r="22"/></g>
    <g fill="none" stroke="#455a66" stroke-width="3" stroke-linecap="round"><path d="M1028 446q10 7 20 0"/><path d="M1110 445q10 14 20 0"/><circle cx="1202" cy="447" r="7"/><path d="M1274 450h20"/></g>
  </g>
  <text x="1038" y="532" text-anchor="middle" class="small">neutral</text><text x="1120" y="532" text-anchor="middle" class="small">smile</text><text x="1202" y="532" text-anchor="middle" class="small">surprise</text><text x="1284" y="532" text-anchor="middle" class="small">focus</text>

  <rect x="64" y="660" width="1312" height="130" rx="22" fill="#fff3ec" stroke="#e6b9a3" stroke-width="2"/>
  <text x="92" y="699" class="stage" fill="#9f5637">TRAINING-ONLY CHECKS · NOT THE HANDSET REQUEST PATH</text>
  <rect x="92" y="720" width="226" height="44" rx="12" fill="#fff" stroke="#dfad96"/><text x="205" y="748" text-anchor="middle" class="box-sub">identity recognisability</text>
  <rect x="338" y="720" width="226" height="44" rx="12" fill="#fff" stroke="#dfad96"/><text x="451" y="748" text-anchor="middle" class="box-sub">target visual style</text>
  <rect x="584" y="720" width="226" height="44" rx="12" fill="#fff" stroke="#dfad96"/><text x="697" y="748" text-anchor="middle" class="box-sub">expression consistency</text>
  <rect x="830" y="706" width="252" height="72" rx="14" fill="url(#placeholder)" stroke="#9372ac" stroke-dasharray="8 6"/><text x="956" y="736" text-anchor="middle" class="tag">OPTIONAL ROLE PLACEHOLDER</text><text x="956" y="760" text-anchor="middle" class="box-sub">adversarial evaluator class</text>
  <path d="M1082 742H1166V596H788V584" class="train"/>

  <rect x="64" y="820" width="1312" height="50" rx="14" fill="#fff" stroke="#dfe6e9"/>
  <line x1="92" y1="845" x2="136" y2="845" class="arrow"/><text x="150" y="850" class="legend">inference</text>
  <line x1="260" y1="845" x2="304" y2="845" class="train"/><text x="318" y="850" class="legend">training feedback</text>
  <rect x="504" y="836" width="28" height="18" rx="4" fill="url(#placeholder)" stroke="#9372ac" stroke-dasharray="5 4"/><text x="544" y="850" class="legend">functional placeholder; actual block not retained</text>
  <text x="1344" y="850" text-anchor="end" class="legend">No proprietary objectives or metrics claimed</text>
</svg>
