<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Mobile model deployment and validation architecture</title>
  <desc id="desc">A system-level deployment path from PyTorch and CUDA training through compression, ONNX or intermediate representation export, operator and runtime validation, Hexagon DSP or Kirin NPU execution, with visual regression feedback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#526d82"/></marker>
    <marker id="feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c5683f"/></marker>
    <pattern id="placeholder" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f5f0fb"/><line y2="10" stroke="#ded1ee" stroke-width="3"/></pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2a3d4d" flood-opacity=".1"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.kicker{font-size:18px;font-weight:750;letter-spacing:3px;fill:#a95837}.title{font-size:40px;font-weight:760;fill:#223744}.sub{font-size:20px;fill:#60717c}.stage{font-size:16px;font-weight:760;letter-spacing:1.8px;fill:#60717c}.box-title{font-size:21px;font-weight:720;fill:#263c48}.box-sub{font-size:15px;fill:#65747d}.small{font-size:14px;fill:#6f7b82}.white-title{font-size:21px;font-weight:720;fill:#fff}.white-sub{font-size:15px;fill:#cbd8df}.tag{font-size:12px;font-weight:780;letter-spacing:1.2px;fill:#6f4c88}.legend{font-size:14px;fill:#596871}.arrow{fill:none;stroke:#526d82;stroke-width:4;marker-end:url(#arrow)}.feedback{fill:none;stroke:#c5683f;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#feedback)}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#fbfaf8"/>
  <text x="64" y="67" class="kicker">MOBILE DEPLOYMENT</text>
  <text x="64" y="120" class="title">The model is not finished until the phone runs it</text>
  <text x="64" y="158" class="sub">Training graph → compressed graph → device runtime → image-level validation</text>

  <g filter="url(#shadow)">
    <rect x="64" y="240" width="258" height="388" rx="24" fill="#fff" stroke="#d9e3e8" stroke-width="2"/>
    <rect x="352" y="240" width="258" height="388" rx="24" fill="#fff" stroke="#d9e3e8" stroke-width="2"/>
    <rect x="640" y="240" width="350" height="388" rx="24" fill="#fff" stroke="#d9e3e8" stroke-width="2"/>
    <rect x="1020" y="240" width="356" height="388" rx="24" fill="#fff" stroke="#d9e3e8" stroke-width="2"/>
  </g>
  <text x="90" y="278" class="stage">01 · TRAIN</text><text x="378" y="278" class="stage">02 · COMPRESS + EXPORT</text><text x="666" y="278" class="stage">03 · DEVICE RUNTIME</text><text x="1046" y="278" class="stage">04 · VALIDATE</text>

  <rect x="90" y="310" width="206" height="132" rx="18" fill="url(#placeholder)" stroke="#9372ac" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="193" y="342" text-anchor="middle" class="tag">ROLE PLACEHOLDER</text>
  <text x="193" y="380" text-anchor="middle" class="box-title">Visual model</text>
  <text x="193" y="410" text-anchor="middle" class="box-sub">segmentation or GAN class</text>
  <rect x="90" y="472" width="206" height="112" rx="18" fill="#eaf2f5" stroke="#c5d8e1"/>
  <text x="193" y="513" text-anchor="middle" class="box-title">PyTorch</text>
  <text x="193" y="543" text-anchor="middle" class="box-sub">CUDA training graph</text>
  <text x="193" y="568" text-anchor="middle" class="box-sub">reference outputs</text>

  <path d="M322 434H352" class="arrow"/>
  <rect x="378" y="310" width="206" height="112" rx="18" fill="#fff3ec" stroke="#e2b39d"/>
  <text x="481" y="351" text-anchor="middle" class="box-title">Compression</text>
  <text x="481" y="382" text-anchor="middle" class="box-sub">quantisation · pruning</text>
  <rect x="378" y="448" width="206" height="136" rx="18" fill="#eaf2f5" stroke="#c5d8e1"/>
  <text x="481" y="489" text-anchor="middle" class="box-title">ONNX / IR</text>
  <text x="481" y="520" text-anchor="middle" class="box-sub">graph conversion</text>
  <text x="481" y="547" text-anchor="middle" class="box-sub">shape · precision · ops</text>
  <path d="M481 422V440" class="arrow"/>

  <path d="M610 434H640" class="arrow"/>
  <rect x="666" y="310" width="298" height="104" rx="18" fill="#263d4a"/>
  <text x="815" y="350" text-anchor="middle" class="white-title">Compatibility gate</text>
  <text x="815" y="381" text-anchor="middle" class="white-sub">supported operators · memory · numerics</text>
  <path d="M815 414V442" class="arrow"/>
  <rect x="666" y="452" width="138" height="132" rx="18" fill="#edf4e8" stroke="#bed2b3"/>
  <text x="735" y="496" text-anchor="middle" class="box-title">Hexagon</text>
  <text x="735" y="526" text-anchor="middle" class="box-sub">DSP runtime</text>
  <text x="735" y="552" text-anchor="middle" class="small">device path</text>
  <rect x="826" y="452" width="138" height="132" rx="18" fill="#edf4e8" stroke="#bed2b3"/>
  <text x="895" y="496" text-anchor="middle" class="box-title">Kirin</text>
  <text x="895" y="526" text-anchor="middle" class="box-sub">NPU runtime</text>
  <text x="895" y="552" text-anchor="middle" class="small">device path</text>

  <path d="M990 434H1020" class="arrow"/>
  <rect x="1046" y="310" width="304" height="88" rx="18" fill="#eaf2f5" stroke="#c5d8e1"/>
  <text x="1198" y="346" text-anchor="middle" class="box-title">Execution check</text>
  <text x="1198" y="375" text-anchor="middle" class="box-sub">loads · runs · returns output</text>
  <rect x="1046" y="420" width="304" height="88" rx="18" fill="#fff3ec" stroke="#e2b39d"/>
  <text x="1198" y="456" text-anchor="middle" class="box-title">Visual regression</text>
  <text x="1198" y="485" text-anchor="middle" class="box-sub">mask edges · face stability</text>
  <rect x="1046" y="530" width="304" height="54" rx="16" fill="#edf4e8" stroke="#bed2b3"/>
  <text x="1198" y="564" text-anchor="middle" class="box-title">Deliverable device graph</text>

  <rect x="64" y="678" width="1312" height="112" rx="20" fill="#fff3ec" stroke="#e6b9a3"/>
  <text x="92" y="717" class="box-title">Compatibility and quality feedback</text>
  <text x="92" y="750" class="box-sub">Unsupported operator → revise graph or model · visual drift → revisit compression/export · performance limit → rebalance size, memory traffic and quality</text>
  <path d="M1198 628V670" class="feedback"/><path d="M746 678V648H481V592" class="feedback"/>

  <rect x="64" y="820" width="1312" height="50" rx="14" fill="#fff" stroke="#dfe6e9"/>
  <rect x="92" y="836" width="28" height="18" rx="4" fill="url(#placeholder)" stroke="#9372ac" stroke-dasharray="5 4"/><text x="132" y="850" class="legend">task-specific functional placeholder</text>
  <line x1="440" y1="845" x2="484" y2="845" class="arrow"/><text x="498" y="850" class="legend">delivery path</text>
  <line x1="660" y1="845" x2="704" y2="845" class="feedback"/><text x="718" y="850" class="legend">measured validation feedback</text>
  <text x="1344" y="850" text-anchor="end" class="legend">No unretained FPS, latency or model size</text>
</svg>
