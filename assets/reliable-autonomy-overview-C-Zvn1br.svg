<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1760" role="img" aria-labelledby="title description">
  <title id="title">Research Overview: Reliable Autonomy for Adaptive AI Agents</title>
  <desc id="description">A vector research overview with nine linked research blocks and company-level signals from 829 deduplicated job descriptions. Percentages are manually coded theme matches within each company sample, not company endorsement or investment.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4faff"/><stop offset="1" stop-color="#e4f2ff"/></linearGradient>
    <radialGradient id="core" cx="44%" cy="36%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d8edff"/></radialGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17365d" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16385f"/></marker>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102d55; }
      .title { font-size: 62px; font-weight: 780; letter-spacing: -2px; fill: #092752; }
      .subject { font-size: 38px; font-weight: 720; fill: #153b69; }
      .subtitle { font-size: 28px; font-weight: 520; fill: #345d8d; }
      .panel { fill: url(#panel); stroke: #d6eafb; stroke-width: 1.5; }
      .area { font-size: 33px; font-weight: 760; fill: #1461c8; }
      .question { font-size: 23px; font-weight: 590; fill: #14345c; }
      .block { fill: #ffffff; stroke: #16385f; stroke-width: 2.5; filter: url(#shadow); }
      .block-title { font-size: 20px; font-weight: 700; text-anchor: middle; pointer-events: none; }
      .block-detail { font-size: 16px; fill: #456484; text-anchor: middle; pointer-events: none; }
      .connector { fill: none; stroke: #16385f; stroke-width: 3; marker-end: url(#arrow); }
      .core-title { font-size: 29px; font-weight: 780; text-anchor: middle; fill: #102d55; }
      .core-note { font-size: 18px; font-weight: 620; text-anchor: middle; fill: #31567f; }
      .evidence-title { font-size: 50px; font-weight: 780; text-anchor: middle; fill: #092752; }
      .evidence-subtitle { font-size: 23px; text-anchor: middle; fill: #345d8d; }
      .evidence-card { fill: url(#panel); stroke: #d6eafb; stroke-width: 1.5; }
      .evidence-heading { font-size: 30px; font-weight: 760; fill: #1461c8; }
      .company { font-size: 21px; font-weight: 560; fill: #17375f; }
      .percent { font-size: 21px; font-weight: 740; text-anchor: end; fill: #0c4599; }
      .rule { stroke: #bfd5e7; stroke-width: 1.2; }
      .source { font-size: 17px; text-anchor: middle; fill: #345d8d; }
      .icon { fill: none; stroke: #1461c8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
      a { cursor: pointer; outline: none; }
      a:hover .block, a:focus .block { fill: #edf6ff; stroke: #0d5dc4; stroke-width: 4; }
      a:hover .block-title, a:focus .block-title { fill: #0d55b2; }
    </style>
